# ppt-deck 디자인 토큰 — dive 프로파일
#
# 「Dive 인공지능의 이해」 2~6차시 시리즈의 디자인이다. 그 덱들은 pptxgenjs 공통 모듈
# (common.js, 2026-10-01)로 만들어졌고, 값은 거기서 옮겼다:
#   LAYOUT_WIDE 13.333x7.5in = 960x540pt, 마진 0.85in = 61pt, 모서리 0.16in = 11.5pt(전 도형 하나),
#   흰 바탕 · 잉크 121821 · 파랑 1B7FD4 · 어두운 장 0E1A2B · 노랑 FFC531(알약·Colab 칸 표시),
#   제목 38pt Bold, 글자 간격 = 34pt 이상 -0.02em · 15pt 이하 +0.35pt.
# 판·칸 색은 팔레트를 섞어 만든다 — 실측 EFF4FA=0.93, 17304C=0.79, DCE8F5=0.84 (오차 10 이내).
# 어두운 장의 회청색 글자(7E93AC·AFC4D8)는 파생으로 정확히 안 나와 가까운 값이 나온다.
# house(면담·면접 강의자료 forest, 반경 5pt)와 섞어 쓰지 않는다 — 시리즈마다 프로파일 하나.

