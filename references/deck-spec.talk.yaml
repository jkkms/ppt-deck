# 눈썹 · 파트 라벨을 강조색이 아니라 옅은 먹으로. 강조색은 데이터에서 짚는 곳(최빈값 막대, 볼 값)에만
label_color: muted
# 표지: 행사 이름(눈썹) · 한 줄 제목 · 발표자 이름. 이름은 lead 크기 먹색 (사용자 편집 2026-10-27)
cover:
  meta_style: lead
  meta_color: figure
