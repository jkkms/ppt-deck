# ppt-deck 디자인 토큰 — talk 프로파일 (2026-10-27)
#
# 동아리·학회 같은 **발표 덱**용. 「답 분포로 LLM 구별하기」(GDGoC KAIST, One Token Is Enough 소개)를
# 다시 만들면서 굳힌 값이다. 사용자 평: 「너 디자인이 더 좋은 것 같다」 — 제목은 「조금 더 왼쪽, 조금 더 크게」.
#
#   흰 바탕 FFFFFF · 먹 1A1C1F · 신호 주황 FF5A1F(데이터에서 짚는 곳에만) · 어두운 장 141619
#   좌우 여백 40pt(0.55in) · 제목 40pt SemiBold · 본문 16pt · 모서리 7pt(0.1in, 그릇에만 — 막대·칸은 직각)
#   판·표 머리는 강조색이 아니라 먹을 옅게 한 중립 회색(tint_from: figure)
#
# 밝은 장과 어두운 장은 역할로 나눈다: 표지·청중 참여(「골라 보세요」)·파트·마무리는 어두운 장(invert: true),
# 내용은 흰 장. house(면담·면접 forest)·dive 시리즈와 섞지 않는다 — 시리즈마다 프로파일 하나.

