# ppt-deck 아웃라인 예시 — 명세서 아트보드 17장과 1:1 대응한다.
# 더미 문구는 HANDOFF §8 의 것을 그대로 썼다. 좌표 대조용이다.
meta:
  title: "재고 예측을\n다시 설계한다"
  palette: forest
  density: speaker
  output: "out/deck.pptx"

slides:
  # 01 cover · letterpress
  - layout: cover
    eyebrow: "01 / 2026 연간 전략"
    year: "26"
    title: "재고 예측을\n다시 설계한다"
    meta: ["제품기획팀 · 2026년 3월 12일", "내부 검토용 초안 v3"]

  # 03 section · blueprint 반전
  - layout: section
    number: "03"
    runner: "3개 장 · 7분"
    title: "주문 주기를\n먼저 쪼갠다"

  # 04 statement 적음 · graphite
  - layout: statement
    eyebrow: "02 / 논점"
    runner: "직전 4분기 실측 기준"
    text: "문제는 예측이 아니라 입력 시점이다"

  # 06 two_col 가득 · letterpress
  - layout: two_col
    eyebrow: "03 / 설계"
    title: "무너지는\n세 지점"
    lead: "사람이 아니라 절차의 문제다."
    bullets:
      - "발주 승인은 주 단위, 판매 데이터는 일 단위로 들어온다. 두 주기가 어긋나는 구간에서 예측은 늘 과소 추정된다."
      - "창고 실사 결과가 장부에 닿기까지 평균 사흘. 그 사흘은 어디에도 남지 않는다."
    subhead: "그래서 순서를 바꾼다"
    subbody: "모델 교체보다 입력 주기 정렬이 먼저다."

  # 08 cards pair (2) · blueprint
  - layout: cards
    eyebrow: "04 / 두 갈래"
    title: "선택지는 둘뿐이다"
    items:
      - {index: "가", title: "주기를 맞춘다", body: "발주와 판매 데이터를 같은 주기로 모은다. 비용은 한 분기치 개발 공수."}
      - {index: "나", title: "모델을 바꾼다", body: "입력은 그대로 두고 예측기를 교체한다. 같은 오차가 다시 나타난다."}

  # 05 statement 가득 · graphite
  - layout: statement
    eyebrow: "02 / 논점"
    text: "재고는 창고의 문제가 아니라 주문서의 문제다"
    body: "발주 확정과 판매 반영 사이의 지연이 예측 오차의 절반을 만든다. 모델을 바꾸기 전에 이 구간을 먼저 줄인다."

  # 09 cards ledger (3) · blueprint
  - layout: cards
    eyebrow: "05 / 절차"
    title: "사흘로 끝내는 순서"
    items:
      - {index: "1", title: "캘리브레이션", body: "표본 20편으로 합의 점수표를 만든다. 전원이 같은 답안을 본다."}
      - {index: "2", title: "1차 채점", body: "항목별 점수와 근거 문장을 함께 남긴다. 근거 없는 점수는 받지 않는다."}
      - {index: "3", title: "편차 3점 이상만 재심", body: "판정 이력을 로그로 남긴다. 누가 왜 바꿨는지가 남아야 한다."}

  # 12 data 가득 · dive
  - layout: data
    eyebrow: "08 / 실측"
    items:
      - {value: "11.3", unit: "점", caption: "조교 간 평균 점수 편차. 무작위 40편을 다시 채점해 얻은 값이다."}
      - {value: "62", unit: "시간", caption: "1회차 총 채점 시간"}
      - {value: "27", unit: "%", caption: "이의제기로 되돌아온 답안"}
      - {value: "3", unit: "일", caption: "실사 반영까지 걸리는 시간"}

  # 10 cards quad (4) · graphite
  - layout: cards
    eyebrow: "06 / 점검"
    title: "네 가지를 확인한다"
    items:
      - {index: "01", title: "입력 주기", body: "발주와 판매가 같은 주기로 모이는가"}
      - {index: "02", title: "실사가 장부에 닿는 날수", body: "며칠 만에 반영되는가"}
      - {index: "03", title: "표본 분포", body: "난이도 구간을 고르게 덮는가"}
      - {index: "04", title: "판정 이력", body: "누가 왜 바꿨는지 남는가"}

  # chain · 전제 + 꼬리를 무는 질문
  - layout: chain
    eyebrow: "06 | 되묻기"
    title: "한 번으로 끝나지 않는다"
    lead: "한 문장에서 세 번 파고든 실제 사례"
    panel: "발주 주기를 판매 주기에 맞추면 예측 오차가 줄어든다고 보고했다."
    steps:
      - "두 주기를 맞추는 비용은 얼마인가?"
      - "맞춘 뒤에도 남는 오차는 무엇인가?"
      - "그 오차는 모델로 줄일 수 있는가?"

  # panel_list · 전폭 tint 패널 + 번호 칩 + 하위 행
  - layout: panel_list
    eyebrow: "07 | 되묻기"
    title: "예상 질문"
    lead: "발주 주기와 예측 오차 · 3–5번"
    items:
      - index: "3"
        text: "발주 주기를 판매 주기에 맞추면 오차가 줄어든다고 보고했습니다."
        subs: ["두 주기를 맞추는 비용은 얼마입니까?", "맞춘 뒤에도 남는 오차는 무엇입니까?"]
      - index: "4"
        text: "실사 반영이 평균 사흘 걸린다고 했습니다."
        subs: ["그 사흘은 어느 장부에도 남지 않습니까?"]

  # card_grid · 세로 카드
  - layout: card_grid
    eyebrow: "08 | 점검"
    title: "동시에 보는 네 곳"
    items:
      - {index: "1", title: "발주", body: "주 단위로 승인이 모인다"}
      - {index: "2", title: "판매", body: "일 단위로 수집된다"}
      - {index: "3", title: "실사", body: "평균 사흘 지연된다"}
      - {index: "4", title: "재심", body: "편차 3점이 기준이다"}

  # timeline · 가로 타임라인
  - layout: timeline
    eyebrow: "09 | 경과"
    title: "네 분기에 걸쳐 벌어진 일"
    live_from: 4
    nodes:
      - {when: "1분기", title: "주기가 어긋나다", body: "발주는 주 단위, 판매는 일 단위"}
      - {when: "2분기", title: "오차가 쌓이다", body: "과소 추정 구간이 반복된다"}
      - {when: "3분기", title: "원인을 찾다", body: "실사 반영 지연 사흘을 확인"}
      - {when: "4분기", title: "순서를 바꾸다", body: "모델 교체보다 주기 정렬을 먼저"}
    footnote: "출처 · 분기 운영 로그"

  # stair · 단계가 넓어지는 계단
  - layout: stair
    eyebrow: "10 | 성숙도"
    title: "성숙도는 계단이다"
    items:
      - {index: "1", title: "1단계 · 수기 집계", body: "엑셀로 주 단위 취합", label: "현재"}
      - {index: "2", title: "2단계 · 주기 정렬", body: "발주와 판매를 같은 주기로", label: "1분기"}
      - {index: "3", title: "3단계 · 자동 반영", body: "실사 결과가 당일 장부에 닿는다", label: "2분기"}
      - {index: "4", title: "4단계 · 예측 교체", body: "정렬된 입력 위에서 모델을 바꾼다", label: "3분기"}

  # compare · 좌우 대비
  - layout: compare
    eyebrow: "11 | 판단"
    title: "두 길 가운데 하나를 고른다"
    pair:
      - title: "모델을 먼저 바꾼다"
        body: "입력은 그대로 두고 예측기를 교체한다. 같은 오차가 다시 나타난다."
      - good: true
        title: "주기를 먼저 맞춘다"
        body: "발주와 판매를 같은 주기로 모은다. 비용은 한 분기치 개발 공수다."

  # nest · 포함관계
  - layout: nest
    eyebrow: "12 | 범위"
    title: "예측 · 정렬 · 집계"
    rings:
      - {name: "집계", body: "발주와 판매 데이터를 모으는 단계 전체"}
      - {name: "정렬", body: "두 주기를 같은 기준으로 맞추는 구간"}
      - {name: "예측", body: "정렬된 입력 위에서만 의미가 있는 모델"}
    conclusion: "집계 안에 정렬, 그 안에 예측"

  # code · 고정폭 코드 블록 + 발표 노트
  - layout: code
    eyebrow: "13 | 확인"
    title: "주기를 맞춘 뒤 오차 재계산"
    lead: "두 데이터를 같은 주기로 모은 뒤 오차를 다시 잰다"
    notes: |
      resample('W') 는 일 단위 데이터를 주 단위로 묶는다. 발주 주기와 맞추기 위한 것이다.
      mae 가 줄지 않으면 주기가 원인이 아니라는 뜻이므로, 그때는 모델을 본다.
      실습에서는 3분기 데이터만 써도 차이가 보인다.
    code:
      - "import pandas as pd"
      - ""
      - "sales = sales.resample('W').sum()   # 일 단위를 주 단위로"
      - "df = orders.join(sales, how='left')   # 주기를 맞춰 합친다"
      - "mae = (df.pred - df.real).abs().mean()   # 평균 절대 오차"
    caption: "출처 · 운영 노트 3분기"

  # code_explain · 코드 왼쪽 · 설명 오른쪽 + 배열 칸
  - layout: code_explain
    eyebrow: "14 | 계산"
    title: "칸마다 한꺼번에 계산된다"
    kind: "함께 해 봅시다"
    code:
      - "arr * 2"
      - ""
      - "array([2, 4, 6, 8, 10, 12])"
    point: "모든 칸에 한꺼번에"
    explain: "반복문을 쓰지 않아도 칸마다 알아서 계산됩니다."
    cells_label: "arr * 2"
    cells: ["2", "4", "6", "8", "10", "12"]
    notes: |
      브로드캐스팅이라고 부른다. 배열 전체에 같은 연산을 한 번에 건다는 뜻이다.
      반복문으로 같은 일을 하면 줄 수도 늘고 느려진다. 여기서 속도 차이를 한 번 재 보여 주면 좋다.

  # cellgrid · 자료구조를 칸으로 그려 가르친다
  - layout: cellgrid
    eyebrow: "15 | 구조"
    title: "한 줄이면 시리즈, 표면 데이터프레임"
    blocks:
      - title: "시리즈  Series"
        desc: "값이 한 줄로 늘어선 것. 표의 한 열입니다."
        headers: ["인덱스", "값"]
        widths: [1, 1.7]
        rows: [["0", "서울"], ["1", "부산"], ["2", "대구"]]
      - title: "데이터프레임  DataFrame"
        desc: "가로세로가 있는 표. 시리즈 여러 개가 모인 것."
        headers: ["", "도시", "발주", "판매"]
        widths: [0.7, 1.2, 1, 1]
        rows: [["0", "서울", "24", "31"], ["1", "부산", "18", "16"], ["2", "대구", "12", "14"]]

  # gallery · 같은 것을 여러 방식으로
  - layout: gallery
    eyebrow: "16 | 시각화"
    title: "같은 숫자, 네 가지 그림"
    items:
      - {image: "sample/chart-line.png", title: "꺾은선", code: "plt.plot", body: "변해 가는 흐름"}
      - {image: "sample/chart-bar.png", title: "막대", code: "plt.bar", body: "항목끼리 비교"}
      - {image: "sample/chart-scatter.png", title: "산점도", code: "plt.scatter", body: "둘 사이의 관계"}
      - {image: "sample/chart-pie.png", title: "원", code: "plt.pie", body: "전체에서의 몫"}

  # 14 quote · letterpress
  - layout: quote
    text: "규칙을 문서로 못 박기 전까지, 우리가 공정하다고 부른 것은 그날 조교의 컨디션이었다."
    source: "운영 회고록"
    note: "2025년 가을, 조교 6명 인터뷰"

  # 11 cards dense (6) · graphite
  - layout: cards
    eyebrow: "07 / 범위"
    title: "여섯 곳을 동시에 본다"
    items:
      - {index: "01", title: "발주 승인", body: "주 단위로 모인다"}
      - {index: "02", title: "판매", body: "일 단위 수집"}
      - {index: "03", title: "실사", body: "평균 사흘 지연"}
      - {index: "04", title: "예측", body: "과소 추정 구간"}
      - {index: "05", title: "재심", body: "편차 3점 기준"}
      - {index: "06", title: "로그", body: "판정 이력 보존"}

  # 07 two_col 적음 · letterpress
  - layout: two_col
    eyebrow: "05 / 남은 위험"
    title: "설계가\n막지 못하는 것"
    bullets:
      - "표본이 난이도 분포를 못 덮는 구간. 재심 물량이 예측을 넘기면 일정이 밀린다."

  # 13 data 적음 · dive
  - layout: data
    eyebrow: "09 / 한 숫자"
    runner: "2030년 전망"
    items:
      - {value: "+7,800", unit: "만", caption: "사라지는 일을 빼고도 순증하는 일자리. 세계경제포럼 「일자리의 미래 2025」"}

  # 15 table · graphite
  - layout: table
    eyebrow: "10 / 운영"
    title: "사흘 계획과 산출물"
    headers: ["단계", "인원", "시간", "산출물 수"]
    rows:
      - ["D-1 캘리브레이션", "6", "3", "1"]
      - ["D1 1차 채점", "6", "24", "480"]
      - ["D2 교차 검수", "2", "16", "62"]
      - ["D3 이의 처리", "1", "8", "27"]
      - ["합계", "6", "51", "570"]
    footnote: "시간은 인당 누적 기준. 합계 행의 인원은 중복을 제외한 실인원이다."

  # 02 closing · letterpress 반전
  - layout: closing
    eyebrow: "04 / 마무리"
    ledger:
      - {label: "담당", value: "제품기획팀 · 이든"}
      - {label: "회신 기한", value: "3월 27일 금요일까지"}
      - {label: "문서", value: "내부 위키 · 재고예측 2026"}
    title: "다음 단계는"
