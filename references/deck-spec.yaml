# ppt-deck 디자인 토큰 — house 프로파일
#
# v3. 이 값들은 만들어낸 것이 아니라 사용자가 직접 만든 덱 4종(137장)에서 실측한 것이다.
#   Dive 인공지능의 이해 1차시 / 소집면담00·01 강의자료 / 전북과학고 시범수업
# 측정 결과 — 본문 11.5·13pt 가 전체 run 의 39%, 슬라이드 제목 31pt(가장 흔함) 또는 38pt,
#   표지 46pt, 최대 72pt(1회). 좌우 마진 58, 수직 리듬 45(눈썹) / 68(제목) / 117(본문).
# v2(편집디자인 프로파일)는 deck-spec.editorial.yaml 에 남겨뒀다 — display 84·mega 200 은
#   실측 최대치의 2~3배라 "글자가 너무 크다"는 지적의 원인이었다.

canvas:
  width_pt: 960
  height_pt: 540

grid:
  margin_x: 58        # 실측 — 면접대비 3종 전부 좌 58 / 우 902
  margin_top: 45
  margin_bottom: 45
  columns: 12
  col_w: 52
  gutter: 20          # step 72. x = 58 + (n-1)*72, w = 72s - 20. span12 = 844 (58..902)

# --- 수직 리듬: 실측된 세 지점. 모든 본문 레이아웃이 공유한다 -------------------
rhythm_y:
  eyebrow_y: 45
  title_y:   68
  content_y: 117      # 본문 영역 117..495 (378pt)
  content_bottom: 495

palettes:
  letterpress: {ground: "F4F1EA", figure: "1B1B1F", accent: "C8452D"}
  blueprint:   {ground: "122033", figure: "EDE6D6", accent: "D98E32"}
  graphite:    {ground: "FAFAF8", figure: "22252A", accent: "6E7F32"}
  dive:        {ground: "0E1A2B", figure: "FFFFFF", accent: "1B7FD4"}
  forest:      {ground: "FBFAF7", figure: "161C18", accent: "1F5D42"}   # 면접대비 덱 실측
active_palette: letterpress

# --- 색: 3색 -> 4단 톤 램프. 새 hex 는 생기지 않는다(전부 figure->ground 파생) ----
# 실측 근거 — 면접대비 덱은 161C18 / 3D4841 / 6B776F / 97A29B 의 4단 램프를 쓴다.
# 작은 활자에서 위계를 만들려면 2단(figure·muted)으로는 부족하다.
colors:
  tone_ink2:  0.22        # 본문 보조 · 표 셀
  tone_muted: 0.48        # 캡션 · 러너
  tone_faint: 0.68        # 구분선 · 아주 약한 배경 활자
  hairline_mix: 0.78      # 0.5pt 구조선 전용. 활자에는 쓰지 않는다
  accent_tint_mix: 0.94   # 패널 채움 (실측 EDF1EC)
  accent_soft_mix: 0.37   # 보조 배지·연결선 (실측 6E9C7F)
  accent_mid_mix:  0.75   # 중첩 다이어그램 중간 고리 (실측 C7DDF2)
  accent_pale_mix: 0.88   # 중첩 바깥 고리 (실측 E4EDF7)
  min_ratio_body: 4.5     # body 이상 크기는 ground 대비 4.5:1
  min_ratio_caption: 3.0  # 캡션(small·micro)은 3.0:1

# --- 타입 스케일: 전부 사용자 덱에서 실제로 쓰인 크기다 -----------------------
# tracking 1/100pt. 큰 활자는 음수, 작은 활자는 약간 양수 (apple-design §15).
styles:
  hero:    {font: display, size: 62,   leading: 1.02, tracking: -150}  # 숫자 한 장
  cover:   {font: display, size: 46,   leading: 1.15, tracking: -90}   # 표지 제목
  display: {font: head,    size: 38,   leading: 1.20, tracking: -60}   # 섹션 · 스테이트먼트
  h1:      {font: head,    size: 31,   leading: 1.20, tracking: -40}   # 슬라이드 제목(주력)
  h2:      {font: head,    size: 21,   leading: 1.30, tracking: -20}   # 소제목 · 카드 제목
  lead:    {font: body,    size: 15.5, leading: 1.45, tracking: 0}     # 리드 문장
  body:    {font: body,    size: 13,   leading: 1.54, tracking: 0}     # 본문(주력)
  small:   {font: body,    size: 11.5, leading: 1.48, tracking: 0}     # 캡션 · 표 셀
  micro:   {font: label,   size: 10.5, leading: 1.40, tracking: 60}    # 눈썹 · 러너 · 각주

style_usage:
  hero:    [data.hero]
  cover:   [cover.title, closing.title]
  display: [section.title, statement.text]
  h1:      ["*.title"]
  h2:      [two_col.subhead, cards.item_title, data.secondary_value]
  lead:    [two_col.lead, statement.body]
  body:    ["*.body", table.cell, cards.item_body]
  small:   ["*.caption", table.header_label, data.secondary_label]
  micro:   ["*.eyebrow", "*.runner", "*.footnote", page_number]

fonts:
  display: "Pretendard SemiBold"   # 실측 최대 72pt 에서도 Black 은 쓰지 않았다
  head:    "Pretendard SemiBold"
  body:    "Pretendard"
  label:   "Pretendard Medium"

anchors:
  fill_threshold: 0.58   # 본문 블록 / 378 >= 0.58 -> 상단(117), 미만 -> 하단(495)
  gap_block: 24

plates:
  plate_min_side: 26
  plate_needs_text: true
rules:
  hero_rule_w: 1.5
  table_rule_w: 0.5

cards:
  mode_by_count: {2: pair, 3: ledger, 4: quad, 5: dense, 6: dense}
  gutter_v: 28

# --- 도형 어휘: 실측값. 텍스트만 있는 장이 이어지면 아무도 안 본다 ------------
shapes:
  badge_d:      32      # 주 배지 지름 (실측 124회)
  badge_d_sub:  24      # 보조 배지 (실측 62회)
  badge_gap:    13      # 배지 오른변 -> 텍스트 (실측 174회, 압도적 최빈값)
  panel_h:      61      # 한 줄짜리 패널 높이 (실측 61.3)
  panel_radius: 5       # 모서리 반경 (실측 5.0pt)
  panel_pad_x:  24      # 패널 좌 안여백 (실측 117회)
  panel_pad_y:  19      # 패널 상 안여백 (실측 20/22 최빈)
  panel_gap:    27.5    # 전폭 패널 사이 여백 (실측 302.3-168.5-106.4)
  panel_text_x: 86      # 패널 좌변 -> 주문장 x (실측 144.0-57.6)
  chip_w:       47.5    # 번호 칩 (실측 47.5x23, accent 채움 + 11.5pt)
  chip_h:       23
  eyebrow_chip_h: 30    # 눈썹을 칩으로 쓸 때 (실측 147.6x30.2)
  subrow_step:  20      # 패널 안 하위 행 step (실측)
  subrow_indent: 44.6   # 하위 번호 -> 하위 텍스트 (실측 188.6-144.0)
  card_h:       245     # 세로 카드 높이 (실측 244.8)
  card_gap:     14.4    # 카드 사이 (실측)
  card_pad:     13      # 카드 좌 안여백 (실측 74.2-61.2)
  card_badge_d: 40      # 카드 안 배지 (실측 40.3)
  chain_indent: 47.5    # 사슬 들여쓰기 step (실측 82.1 -> 129.6 -> 177.1)
  chain_step:   53      # 사슬 행 step (실측 53.3)
  connector_w:  1       # 연결선 두께 (실측 1.0pt 193회)
  divider_w:    1       # 전폭 구분선 (실측 845 길이 73회)
  # --- 다이어그램 (Dive 10·17·26·27쪽 실측) ---
  node_d:       23      # 타임라인 마디 (실측 23.0)
  node_year_dy: -50     # 축 대비 연도 y (실측 296.6 vs 346.3)
  node_title_dy: 28     # 축 대비 소제목 y (실측 374.4)
  node_desc_dy: 61      # 축 대비 설명 y (실측 407.5)
  stair_h:      65      # 계단 패널 높이 (실측 64.8)
  stair_step:   72      # 계단 행 step (실측 72.0)
  stair_w_min:  0.40    # 첫 단 폭 / 콘텐츠 폭 (실측 337.9/837.6)
  stair_w_max:  0.73    # 마지막 단 (실측 614.4/837.6)
  stair_badge_d: 35     # 계단 배지 (실측 34.6)
  stair_pad_x:  30      # 패널 좌변 -> 배지 (실측 30.2)
  stair_text_x: 82      # 패널 좌변 -> 제목 (실측 82.1)
  compare_h:    212     # 비교 패널 높이 (실측 212.4)
  compare_gap:  25      # 비교 패널 사이 (실측 25.2)

table:
  header_h: 28
  row_h:    32
  pad_x:    12
  col_pattern:
    2: [6, 6]
    3: [6, 3, 3]
    4: [6, 2, 2, 2]
    5: [4, 2, 2, 2, 2]

density: reading        # 실측 — 슬라이드당 텍스트박스 중앙값 10개. 선생님 덱은 고밀도다
density_limits:
  speaker: {bullets: 4, bullet_chars: 60, table_rows: 6}
  reading: {bullets: 7, bullet_chars: 120, table_rows: 9}

# 금지의 기준은 "도형을 쓰지 마라"가 아니라 "장식만 하는 도형을 쓰지 마라"다.
# 사용자 덱 실측 — 슬라이드당 도형 중앙값 5개(배지 295 · 패널 269 · 연결선 124).
# 전부 구조를 나타낸다: 배지는 행의 시작점, 패널은 묶음, 연결선은 관계.
hard_rules:
  - no_shadow
  - no_gradient
  - no_3d
  - no_theme_table_style
  - no_emoji
  - no_decorative_shape    # 모든 도형은 활자를 담거나 두 요소의 관계를 나타내야 한다
  - no_title_underline     # 제목 밑 강조선만은 여전히 금지

rhythm:
  max_same_layout_run: 2
  max_same_cards_mode_run: 1
  page_number_from: 2
