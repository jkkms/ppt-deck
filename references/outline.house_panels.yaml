# house 판 카드 덱 예제 — 면담 · 면접 대비 수업 덱(2026-10-18 ~ 11-18 열세 덱)의 레이아웃을 한 덱에 모은 것.
# 빌드:  scripts/house_panels.py references/outline.house_panels.yaml -o out/house_panels.pptx
# 가상 수업이다(문항은 새로 쓴 것). 실제 강의 아웃라인 · 기출 원문 · 학생 서류는 강의 폴더에만 두고 저장소에 올리지 않는다.
# 레이아웃 설명은 SKILL.md 「house 판 카드 덱」. 한 덱 안에서 이웃한 내용 장끼리 같은 짜임을 피한다.
meta:
  title: "모의 면접 예제"
  palette: forest
  density: reading
  page_numbers_top: true        # house_ext — 쪽 번호는 오른쪽 위 눈썹 줄
  table_style: tint             # 표는 옅은 머리 띠

slides:
  - layout: cover
    invert: true
    eyebrow: "모의 면접 예제"
    title: "판 카드 레이아웃"
    meta: ["과학고 소집면접 대비", "가상 수업"]
    # signature: signature.png  # 표지 오른쪽 아래 서명(흰 획 · 투명 PNG, 아웃라인 폴더 기준)
    notes: |
      표지 노트에는 이 덱의 문항 출처와 순서(문항 → 스스로 매기기 → 풀이)를 적는다.

  - layout: pcards              # 가로 판 카드 2~5 · 배지는 icon / mark / 번호(numbered)
    eyebrow: "여는 장"
    title: "진행 방식"
    band: "문항 사이에는 피드백하지 않습니다"      # 결론 띠 — 진초록 면 + 흰 글씨
    items:
      - {title: "준비 10분", icon: pencil, body: ["종이에 단어와 화살표로", "문장으로 쓰지 않기"]}
      - {title: "답변 5분", icon: quote, body: ["답부터 말하고", "남으면 한마디 더"]}
      - {title: "종이와 펜만", mark: "×", body: ["계산기와 휴대전화 없이", "문항지는 화면으로"]}
    notes: |
      카드 셋의 설명 줄 수를 맞춘다(두 줄씩). 줄 수가 다르면 키노트 실측에서 위아래 여백이 어긋난다.

  - layout: prows               # 세로 줄 판 2~5 · 제목(왼쪽) + 설명(오른쪽)
    eyebrow: "여는 장"
    title: "막혔을 때"
    subtitle: "모르는 부분이 있어도 아는 데까지 말한다"   # house_ext — 모든 장의 제목 아래 회색 한 줄
    numbered: true
    body_col: 6
    items:
      - {title: "시간을 청하기", body: "「잠시 생각해 보고 답해도 될까요?」"}
      - {title: "아는 데까지", body: "세운 식까지, 쓸 개념의 이름까지"}
      - {title: "막힌 곳 밝히기", body: "「여기서부터는 확실하지 않습니다」"}

  - layout: section             # 문항 표지 — part 라벨 + 제목 + 부제
    part: "문항 1"
    title: "주사위로 움직이는 점"
    subtitle: "준비 10분 · 답변 5분"

  # 문항지 조각은 sheet.py 로 만든다 — orig_slides() 가 아래 꼴의 장을 써 준다.
  # - layout: orig
  #   eyebrow: "문항 1 · 문항지 (1/2) · ○○과학고 2023학년도 소집면접"
  #   image: "../figs/orig_x/q1_1.jpg"
  #   scale: 0.5202

  - layout: ask                 # 질문 장 — 판 없이 「질문 N · 출처」 + 큰 질문, 묶음은 슬라이드 세로 정중앙
    eyebrow: "세트 1 | 모의 면담"
    source: "질문 1 · 여는 질문"
    text: "30초 동안 자기소개를 해 주세요.\n방금 말한 것 가운데 하나를 골라 조금 더 말해 주세요."

  - layout: table               # 자기 평가표 — 문항마다 한 열
    eyebrow: "점검"
    title: "자기 평가표"
    headers: ["", "문항 1", "문항 2", "문항 3"]
    rows:
      - ["묻는 것을 한 문장으로 되짚었다", "", "", ""]
      - ["쓸 개념의 이름을 먼저 댔다", "", "", ""]
      - ["계산은 식, 값, 단위 순서로 말했다", "", "", ""]
      - ["막힌 곳에서 아는 데까지 말했다", "", "", ""]
      - ["5분 안에 물음이 요구한 것을 빠짐없이 답했다", "", "", ""]
    footnote: "○ 했다 · △ 일부만 · × 못 했다"

  - layout: pfig                # 풀이 그림 + 결론 줄 + 판 없는 번호 목록(fig_side: below 면 그림이 아래)
    eyebrow: "문항 1 | 풀이"
    title: "먼저 규칙 정리"
    subtitle: "그림에서 시계 방향을 확인"
    image: "sample/chart-pie.png"
    fig_span: 5
    numbered: true
    body_style: body
    conclusion: "멈추기 전까지 점은 [두 꼭짓점만] 오간다"   # [ ] 안 낱말만 강조색
    items:
      - {title: "시계 반대 방향 2/3", body: "6의 약수 1, 2, 3, 6"}
      - {title: "시계 방향 1/3", body: "6의 약수가 아닌 4, 5"}
      - {title: "양 끝에서 멈춤", body: "다음 꼭짓점에 닿으면 끝"}

  - layout: ppanel              # 결론 한 줄 + 한 줄 설명 + 옅은 판 하나(이름표 label · 제목 · 설명 줄)
    eyebrow: "문항 1 | 풀이"
    title: "두 확률의 관계"
    subtitle: "(2) · n이 3 이상인 홀수"
    conclusion: "[f(n) = (1/3) × g(n − 1)]"
    conclusion_sub: "첫 번째에 옮겨 갈 확률 × 남은 n − 1번 만에 도착할 확률"
    body_col: 6
    items:
      - {label: "1번째", title: "바로 끝나면 안 된다", body: "1번 만에 끝나면 n은 1"}
      - {label: "1번째", title: "옆 꼭짓점으로", body: "4 또는 5 → 확률 1/3"}
      - {label: "남은 n − 1번", title: "거기서 도착까지", body: "확률 g(n − 1)"}

  - layout: pgrid               # 2 × 2 판 · 머리는 왼쪽
    eyebrow: "점검"
    title: "영상에서 볼 곳"
    subtitle: "그동안 수업에서 짚은 네 가지"
    items:
      - {title: "답부터", body: "첫 문장이 답인지"}
      - {title: "시선", body: "면접관을 보며 말하는지"}
      - {title: "과학 용어", body: "개념을 정확한 이름으로"}
      - {title: "말끝", body: "흐리지 않고 틀리면 고쳐 말하는지"}

  - layout: pcol                # 판 없는 단 — 컬럼 그리드에 맞춘 세 칸
    numbered: true
    eyebrow: "다음"
    title: "혼자 연습하는 순서"
    items:
      - {title: "문항 하나 고르기", body: ["준비 10분, 답변 5분", "타이머로 재고 녹화"]}
      - {title: "스스로 매기기", body: ["자기 평가표 다섯 줄", "△ ×가 남은 줄 하나"]}
      - {title: "다시 말하기", body: ["그 줄만 고쳐서", "첫 문장부터 다시"]}

  - layout: plist               # 판 없는 목록 — 줄 사이는 여백으로만
    numbered: true
    eyebrow: "당일"
    title: "전날과 아침"
    items:
      - {title: "전날", body: ["컨디션 관리", "감기 걸리지 않도록 주의"]}
      - {title: "아침", body: ["수험표 확인", "입실 시간보다 30분 일찍 도착"]}
      - {title: "들어가기 전", body: ["답변 순서 떠올리기", "답부터 → 묻는 것 전부 → 개념 → 근거 → 한마디 더"]}

  - layout: closing
    label: "다음 일정"
    title: "소집면접"
    line: "최종 합격자 발표"
